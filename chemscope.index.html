<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

.hw{font-weight:600;transition:font-weight .3s}.hw:hover{font-weight:800}

nav.tabs a:hover{color:var(--text);background:var(--surface-2)}nav.tabs a[aria-current=page]{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.ctrl{display:flex;gap:6px;align-items:center}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:20px 16px 40px;outline:0}

.page{display:flex;flex-direction:column;gap:16px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r3);padding:20px;box-shadow:var(--glow);min-width:0}
.card>h2:first-child{display:flex;gap:8px;align-items:center}
.hero{padding:clamp(20px,5vw,44px);text-align:center;position:relative}.lead{color:var(--muted);max-width:56ch;margin:0 auto 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.c{justify-content:center}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.search{display:flex;gap:8px;max-width:640px;margin:0 auto;position:relative}
.in{width:100%;min-height:44px;padding:10px 16px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
.search .in{border-radius:999px;font-size:1.05rem}.search .in:focus{border-color:var(--cyan);outline:0;box-shadow:0 0 0 3px rgba(34,211,238,.25)}
textarea.in{resize:vertical}
.ac{position:absolute;top:100%;left:0;right:0;margin:6px 0 0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);z-index:20;text-align:left;max-height:320px;overflow:auto;box-shadow:var(--glow)}
.ac li{padding:10px 12px;border-radius:var(--r1);cursor:pointer;min-height:44px;display:flex;align-items:center}.ac li:hover,.ac li[aria-selected=true]{background:var(--surface-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r2);background:var(--surface-2);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:.2s}.ccard:hover{transform:translateY(-3px);border-color:var(--cyan)}
.struct{background:#fff;border-radius:var(--r2);padding:8px;display:flex;align-items:center;justify-content:center;min-height:120px}.struct img{max-width:100%;max-height:300px;height:auto}

.ti{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:.8rem;color:var(--link);cursor:help;position:relative}
.ti:hover::after,.ti:focus::after{content:attr(data-tip);position:absolute;bottom:125%;left:50%;transform:translateX(-50%);width:max-content;max-width:230px;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:var(--r1);font:400 .8rem/1.4 Inter;z-index:50;box-shadow:var(--glow);white-space:normal}
.sk{min-height:120px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r3)}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}.empty h3{color:var(--text)}
.ghs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.ghs svg{width:64px;height:64px}
.sev{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0}.sev i{display:block;height:100%;border-radius:999px}
.warn{padding:10px 14px;border-radius:var(--r2);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);font-weight:600}

.diff{background:rgba(251,191,36,.16)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:600;font-size:.85rem}

.legend{display:flex;gap:6px;flex-wrap:wrap}.legend .chip{font-family:Inter;gap:6px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.gradbar{height:14px;border-radius:99px;position:relative;margin:14px 0}.gradbar i{position:absolute;top:-6px;width:4px;height:26px;background:var(--text);border-radius:2px;transition:left .2s}

.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}.opt{min-height:48px;text-align:left;padding:0 16px;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.3)}.opt.ok{background:rgba(52,211,153,.2);border-color:var(--mint)}.opt.bad{background:rgba(251,113,133,.2);border-color:var(--rose)}
.fb{min-height:24px;margin-bottom:8px}.xp{font-weight:700;color:var(--amber)}
:root[data-theme=light] .xp{color:#92400E}
@media(max-width:760px){
 .bento>*{grid-column:span 12!important}

{id:'atoms',title:'Atoms',emoji:'⚛',lessons:[
 {title:'What is an atom?',demo:'bohr',text:'Everything around you is built from atoms. An atom has a tiny nucleus made of protons (positive) and neutrons (no charge), surrounded by a cloud of electrons (negative). The number of protons decides the element: 6 protons always means carbon. In a neutral atom the electrons equal the protons, so the charges cancel out.',quiz:[Q('Which particle decides what element an atom is?',['Electrons','Protons','Neutrons'],1,'The number of protons is the atomic number, which defines the element.'),Q('What charge does an electron carry?',['Positive','None','Negative'],2,'Electrons are negative; protons are positive.'),Q('A neutral atom has 8 protons. How many electrons does it have?',['6','16','8'],2,'Neutral means the charges cancel, so electrons equal protons.')]},
 {title:'Reading the periodic table',demo:'trend',text:'The table lists elements by atomic number, the count of protons. Rows are called periods and columns are called groups. Elements in a group behave alike because they share the same number of outer electrons. Metals fill the left and middle, nonmetals sit on the right, and the noble gases in the last column rarely react at all.',quiz:[Q('What are the table’s columns called?',['Periods','Shells','Groups'],2,'Columns are groups; rows are periods.'),Q('Why do elements in one group behave alike?',['Same number of outer electrons','Same mass','Same colour'],0,'Outer (valence) electrons control chemical behaviour.'),Q('Which group rarely reacts?',['Halogens','Noble gases','Alkali metals'],1,'Noble gases already have full outer shells.')]},
 {title:'Electron shells',demo:'valence',text:'Electrons live in shells around the nucleus. The first shell holds up to 2 electrons and the second up to 8. Atoms are most stable with a full outer shell, so they gain, lose or share electrons to get one. The electrons in the outer shell are called valence electrons, and they decide how an atom bonds.',quiz:[Q('How many electrons fit in the first shell?',['8','2','18'],1,'The first shell is small: just 2.'),Q('Outer-shell electrons are called…',['Valence electrons','Core electrons','Free neutrons'],0,'Valence electrons take part in bonding.'),Q('Why do atoms form bonds?',['To get heavier','To lose protons','To reach a fuller, more stable outer shell'],2,'Sharing, gaining or losing electrons fills the outer shell.')]}]},
{id:'bonding',title:'Bonding',emoji:'🔗',lessons:[
 {title:'Covalent bonds',demo:{cids:[962]},text:'In a covalent bond two atoms share a pair of electrons. Water forms when oxygen shares electrons with two hydrogen atoms. Sharing lets each atom count those electrons toward a full outer shell. Covalent bonds usually link nonmetal atoms, and they build molecules with a definite shape. Drag the 3D molecule to look around.',quiz:[Q('In a covalent bond, electrons are…',['Shared','Completely transferred','Destroyed'],0,'Covalent bonding is sharing.'),Q('Which pair most likely bonds covalently?',['Na and Cl','K and F','H and O'],2,'Two nonmetals share electrons.'),Q('How many hydrogen atoms are in water?',['1','2','3'],1,'H₂O: two hydrogens, one oxygen.')]},
 {title:'Ionic bonds',demo:'bondtype',text:'In an ionic bond one atom hands electrons to another. The giver becomes a positive ion, the receiver a negative ion, and opposite charges attract. Table salt is sodium (Na⁺) and chloride (Cl⁻) packed in a repeating crystal. Ionic bonds usually form between a metal and a nonmetal. Try the demo: pick two elements and see which bond type is likely.',quiz:[Q('In an ionic bond, electrons are…',['Shared equally','Transferred','Created'],1,'One atom gives electrons to the other.'),Q('When sodium loses an electron it becomes…',['A negative ion','A neutral atom','A positive ion'],2,'Losing a negative charge leaves a positive ion.'),Q('Ionic bonds usually form between…',['Two metals','A metal and a nonmetal','Two noble gases'],1,'Metals give electrons; nonmetals take them.')]},
 {title:'Molecular shape',demo:{cids:[297,222,962]},text:'Shape matters. Electron pairs repel each other, so they spread as far apart as possible. Methane has four bonds and forms a tetrahedron; ammonia has three bonds and one lone pair, giving a pyramid; water has two bonds and two lone pairs, making it bent. Shape affects boiling point, smell and how molecules interact.',quiz:[Q('Why do electron pairs spread out?',['They repel each other','They are heavy','They attract the nucleus less'],0,'Like charges repel, so pairs move apart.'),Q('What shape is methane?',['Flat square','Tetrahedral','Linear'],1,'Four bonds spread into a tetrahedron.'),Q('Water’s shape is…',['Straight line','Bent','Triangle of atoms'],1,'Two lone pairs push the hydrogens into a bent shape.')]}]},
{id:'acids',title:'Acids & Bases',emoji:'🧪',lessons:[

async function tour(){const steps=[['Search anything','Type an element, chemical name, formula (C6H12O6), CAS number (50-78-2) or SMILES into the big search bar. Try “Surprise me”!'],['Beginner or Advanced','Beginner shows six key facts and a plain-English summary. Switch to Advanced for full properties, bioactivity and cross-references. Tap any ⓘ to decode jargon.'],['Explore & learn','Use the Periodic Table, handy Tools, short Lessons with quizzes, and My Lab for favorites, notes and PDF reports. Everything stays on your device.']];
 for(let i=0;i<3;i++){const r=await ask({title:`${i+1}/3 · ${steps[i][0]}`,text:steps[i][1],ok:i===2?'Start exploring':'Next',cancel:'Skip tour'});if(!r)break}await S.set('tour',true)}
function bgAnim(){const c=$('#bg'),x=c.getContext('2d');if(!x||RM.matches)return;let w,hh,P=[],run=true,col='#22D3EE';const rs=()=>{w=c.width=innerWidth;hh=c.height=innerHeight;P=Array.from({length:Math.min(34,w/40|0)},()=>({x:Math.random()*w,y:Math.random()*hh,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))};rs();addEventListener('resize',rs);
 const tick=()=>{if(!run)return;x.clearRect(0,0,w,hh);col=getComputedStyle(document.documentElement).getPropertyValue('--cyan').trim()||col;x.strokeStyle=x.fillStyle=col;for(const p of P){p.x=(p.x+p.vx+w)%w;p.y=(p.y+p.vy+hh)%hh;x.globalAlpha=.2;x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill();for(const q of P){const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<120){x.globalAlpha=.12*(1-d/120);x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}}requestAnimationFrame(tick)};
 document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)tick()});tick()}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function applyMode(){$('#m-b').setAttribute('aria-pressed',state.mode==='beginner');$('#m-a').setAttribute('aria-pressed',state.mode==='advanced')}
async function init(){await db.ready;
 state.mode=await S.get('mode','beginner');state.compare=await S.get('compare',[]);const th=await S.get('theme',null);applyTheme(th);applyMode();paintCmp();
 $('#themeBtn').onclick=async()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'),n=cur==='dark'?'light':'dark';applyTheme(n);await S.set('theme',n);toast(n==='dark'?'Dark theme':'Light theme')};
 [['#m-b','beginner'],['#m-a','advanced']].forEach(([s,m])=>$(s).onclick=async()=>{if(state.mode===m)return;state.mode=m;await S.set('mode',m);applyMode();route()});
 $('#cmpBtn').onclick=openCompare;$('#sheetX').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
 $('#refresh').onclick=()=>{setOffline(navigator.onLine===false);route()};addEventListener('online',()=>{setOffline(false);toast('Back online');route()});addEventListener('offline',()=>setOffline(true));
 addEventListener('hashchange',route);if(navigator.onLine===false)setOffline(true);bgAnim();await route();
 if(!(await S.get('tour',false)))tour()}
init();
